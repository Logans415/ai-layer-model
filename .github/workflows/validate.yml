name: Validate release content
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.1 bandit==1.9.4
      - run: ruff check scripts
      - run: ruff format --check scripts
      # Assertions are intentional release checks; CI runs Python without -O.
      - run: bandit -r scripts -s B101
      - run: python scripts/validate_release.py
